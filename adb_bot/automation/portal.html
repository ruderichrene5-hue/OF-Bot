<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northfeed · Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Noto+Sans+Thai:wght@400;600;700&display=swap">
<style>
  :root{color-scheme:dark;--bg:#0b0d12;--bg2:#0f1219;--panel:#161a22;--panel2:#1b2029;--line:#262c38;--line2:#343c4d;--fg:#e6e8ee;--muted:#9aa3b2;--dim:#6b7486;
        --pink:#ff5c9a;--pink2:#ff9ec4;--ice:#ffc2da;--ok:#3fb950;--bad:#ff6b6b;--warn:#d29922;--r:18px;
        --sans:"Bricolage Grotesque","Noto Sans Thai","Helvetica Neue",Arial,sans-serif;--display:"Fraunces","Noto Sans Thai",Georgia,serif}
  *{box-sizing:border-box} html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;
       background-image:radial-gradient(900px 500px at 85% -10%,rgba(255,92,154,.18),transparent 60%),radial-gradient(700px 400px at -10% 30%,rgba(255,158,196,.08),transparent 60%)}
  a{color:inherit;text-decoration:none}
  .nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:18px;padding:14px clamp(16px,4vw,48px);background:rgba(11,13,18,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .logo{display:flex;align-items:center;font-weight:700;font-size:21px;letter-spacing:-.045em;font-variation-settings:"opsz" 96}
  .logo img{height:26px;width:auto;display:block}
  .nav .tabs{display:flex;gap:4px;margin-left:auto}
  .nav .tabs a{padding:8px 14px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px}
  .nav .tabs a.on{background:var(--panel);color:var(--fg);border:1px solid var(--line2)}
  .nav .me{display:flex;align-items:center;gap:10px;margin-left:12px;color:var(--muted);font-size:13px}
  .nav .me .dot{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--ice));display:grid;place-items:center;color:#0b0d12;font-weight:700}
  main{padding:34px clamp(16px,4vw,48px) 80px;max-width:1240px;margin:0 auto}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink2);font-weight:600}
  h1{font-family:var(--display);font-weight:500;font-size:clamp(34px,5vw,56px);line-height:1.02;letter-spacing:-.01em;margin:6px 0 6px;font-variation-settings:"opsz" 144}
  h1 em{font-style:italic;color:var(--pink2)}
  .lead{color:var(--muted);font-size:16px;max-width:60ch;margin:0 0 26px}
  h2{font-family:var(--display);font-weight:500;font-size:26px;margin:0;letter-spacing:-.01em} h2 em{font-style:italic;color:var(--pink2)}
  .sec{margin-top:34px} .sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:14px;flex-wrap:wrap}
  .sec-head .cs{color:var(--muted);font-size:13.5px;margin-top:3px}
  .card{background:linear-gradient(180deg,rgba(26,23,38,.75),rgba(18,16,28,.85));border:1px solid var(--line2);border-radius:var(--r);padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .kpi .l{color:var(--muted);font-size:12.5px} .kpi .v{font-family:var(--display);font-size:34px;line-height:1.05;margin:4px 0 2px;font-variant-numeric:tabular-nums}
  .kpi .d{font-size:12.5px;color:var(--muted)} .up{color:var(--ok)!important} .down{color:var(--bad)!important}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:rgba(255,160,200,.12);color:var(--ice);font-size:12px;font-weight:600;white-space:nowrap}
  .pill.gray{background:rgba(154,163,178,.14);color:var(--muted)} .pill.ok{background:rgba(63,185,80,.14);color:#7ee098} .pill.warn{background:rgba(210,153,34,.16);color:#ffd27a} .pill.bad{background:rgba(255,107,107,.14);color:#ff9b9b}
  .pill.ig{background:rgba(255,92,154,.16);color:var(--pink2)} .pill.tt{background:rgba(230,230,230,.1);color:#e6e8ee} .pill.of{background:rgba(79,140,255,.16);color:#9fc0ff}
  .list{display:flex;flex-direction:column;gap:8px}
  .item{display:grid;grid-template-columns:26px 1fr auto;gap:14px;align-items:start;padding:14px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);transition:border-color .2s,transform .2s}
  .item:hover{border-color:var(--line2);transform:translateY(-1px)}
  .item.done{opacity:.45} .item.done .t{text-decoration:line-through}
  .item.late{border-color:rgba(255,107,107,.45)}
  .chk{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center;cursor:pointer;margin-top:1px;flex:none}
  .chk.on{background:linear-gradient(135deg,var(--pink),#e03d7e);border-color:transparent} .chk svg{width:13px;height:13px;stroke:#fff;stroke-width:3;fill:none;display:none} .chk.on svg{display:block}
  .item .t{font-weight:600;font-size:15px} .item .s{color:var(--muted);font-size:13px;margin-top:2px;line-height:1.45}
  .item .meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
  .item .when{color:var(--dim);font-size:12px;white-space:nowrap}
  .reels{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .reel{position:relative;aspect-ratio:9/15;border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#2a2033,#141821);border:1px solid var(--line);cursor:pointer;display:block}
  .reel img{width:100%;height:100%;object-fit:cover} .reel video{width:100%;height:100%;object-fit:cover;background:#000}
  .reel .ov{position:absolute;inset:auto 0 0 0;padding:44px 13px 12px;background:linear-gradient(transparent,rgba(0,0,0,.88));font-size:12.5px}
  .reel .ov b{display:block;font-size:13.5px;margin-bottom:4px;line-height:1.25} .reel .ov span{margin-right:9px;color:#d9dde6}
  .reel .tag{position:absolute;top:10px;left:10px} .reel .play{position:absolute;top:50%;left:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(11,13,18,.6);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;backdrop-filter:blur(6px)}
  .reel .play svg{width:18px;height:18px;fill:#fff;margin-left:3px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px} @media(max-width:1000px){.grid2{grid-template-columns:1fr}}
  .chart{position:relative} .chart svg{width:100%;height:220px;display:block}
  .tip{position:absolute;pointer-events:none;background:#0f1219;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12.5px;display:none;white-space:nowrap}
  .acc{display:grid;grid-template-columns:44px minmax(150px,1.5fr) 110px 110px 110px 1fr;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
  .acc .lbl{color:var(--muted);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase} .acc .val{font-weight:650;font-variant-numeric:tabular-nums}
  .av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#232938;display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:13px}
  .st{font-weight:650} .st:before{content:"● "} .st.active{color:var(--ok)} .st.inactive,.st.banned{color:var(--bad)} .st.check{color:var(--warn)}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px} @media(max-width:900px){.week{grid-template-columns:repeat(2,1fr)}}
  .day{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:120px}
  .day.today{border-color:var(--pink);box-shadow:0 0 0 1px rgba(255,92,154,.35) inset}
  .day .dn{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600} .day .dd{font-family:var(--display);font-size:22px;margin:2px 0 8px}
  .day .e{font-size:12.5px;padding:6px 8px;border-radius:8px;background:var(--panel2);margin-bottom:6px;line-height:1.3;border-left:3px solid var(--pink)}
  .day .e.of{border-left-color:#4f8cff} .day .e.tt{border-left-color:#cfd3dc} .day .e.task{border-left-color:var(--warn)} .day .e.done{opacity:.45;text-decoration:line-through}
  .day .shoot{display:inline-block;font-size:11px;color:var(--pink2);margin-top:4px}
  .empty{color:var(--muted);padding:22px;text-align:center;border:1px dashed var(--line2);border-radius:14px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;place-items:center;z-index:50;padding:20px} .modal.on{display:grid}
  .modal .box{background:var(--bg2);border:1px solid var(--line2);border-radius:20px;max-width:900px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:minmax(260px,360px) 1fr}
  @media(max-width:800px){.modal .box{grid-template-columns:1fr}}
  .modal .media{background:#000;aspect-ratio:9/16;display:grid;place-items:center} .modal .media video,.modal .media img,.modal .media iframe{width:100%;height:100%;object-fit:cover;border:0}
  .modal .body{padding:22px 24px} .modal .body h3{font-family:var(--display);font-weight:500;font-size:24px;margin:6px 0 4px} .modal .k{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-top:16px}
  .modal .x{position:absolute;top:18px;right:22px;background:var(--panel);border:1px solid var(--line2);color:var(--fg);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:18px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);font-weight:600;font-size:13.5px;cursor:pointer;color:var(--fg)}
  .btn.primary{background:linear-gradient(135deg,var(--pink),#e03d7e);border-color:transparent;color:#fff;box-shadow:0 10px 30px rgba(255,92,154,.3)}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
  .seg button{background:none;border:0;color:var(--muted);font:inherit;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer} .seg button.on{background:var(--panel2);color:var(--fg)}
  @media(max-width:700px){.item{grid-template-columns:26px 1fr}.item .meta{grid-column:2;justify-content:flex-start;margin-top:4px}.nav .me span{display:none}.nav .tabs a{padding:8px 10px;font-size:13px}.kpi .v{font-size:28px}}
  footer{color:var(--dim);font-size:12.5px;text-align:center;padding:30px 0 0}
</style></head>

<script>
const D = __DATA__;
const A = D.accounts, P = D.plan, T = D.tasks, M = D.model;
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n == null ? "–" : Math.abs(n) >= 1e6 ? (n/1e6).toFixed(1).replace(/\.0$/,"") + "M" : Math.abs(n) >= 1e4 ? (n/1e3).toFixed(1).replace(/\.0$/,"") + "K" : Math.round(n).toLocaleString("en-US");
const sgn = n => n == null ? "–" : (n > 0 ? "+" : "") + fmt(n);
const TODAY = D.today;
const dayKey = d => d.toISOString().slice(0,10);
function addDays(k, n){ const d = new Date(k + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return dayKey(d); }
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const dow = k => DOW[new Date(k + "T12:00:00Z").getUTCDay()];
const nice = k => { const d = new Date(k + "T12:00:00Z"); return d.toLocaleDateString("en-GB", { weekday:"short", day:"numeric", month:"short", timeZone:"UTC" }); };
const weekStart = (() => { const d = new Date(TODAY + "T12:00:00Z"); const wd = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - wd); return dayKey(d); })();
const weekEnd = addDays(weekStart, 6);
const pf = p => p === "Instagram" ? "ig" : p === "TikTok" ? "tt" : p === "OnlyFans" ? "of" : "gray";
const stCls = s => ({ Published:"ok", Scheduled:"ok", Edited:"warn", Shot:"warn", "To shoot":"warn", Planned:"gray", Idea:"gray", Dropped:"bad", Done:"ok", Open:"gray", "In progress":"warn", Waiting:"gray" })[s] || "gray";
const isDone = x => x.status === "Published" || x.status === "Done" || x.status === "Dropped" || x.status === "Scheduled";
const DONE = new Set(JSON.parse(localStorage.getItem("nf_done") || "[]"));          // optimistic tick, the server write comes next

function avatar(a){ return a.avatar ? `<img class="av" src="${esc(a.avatar)}" alt="">` : `<div class="av">${esc(a.handle.slice(0,2).toUpperCase())}</div>`; }
function folOn(a, d){ let v = null; for (const k of Object.keys(a.followersDaily).sort()) if (k <= d) v = a.followersDaily[k]; return v; }
function gain(a, n){ const ks = Object.keys(a.followersDaily).sort(); if (ks.length < 2) return null; const last = ks[ks.length-1], s = addDays(last, -n);
  const older = ks.filter(k => k <= s); return older.length ? a.followersDaily[last] - a.followersDaily[older[older.length-1]] : null; }
function days(n){ const out = []; for (let i = n - 1; i >= 0; i--) out.push(addDays(TODAY, -i)); return out; }

// ---------- items for today / this week ----------
function entries(){
  const out = [];
  for (const p of P) out.push({ kind:"plan", id:p.id, date:p.date, title:p.title, sub:[p.type, p.outfit].filter(Boolean).join(" · "), platform:p.platform, status:p.status, done:isDone(p) || DONE.has(p.id), obj:p, fixed:true });
  for (const t of T) out.push({ kind:"task", id:t.id, date:t.due, title:t.title, sub:t.desc, platform:t.category, status:t.status, done:t.status === "Done" || DONE.has(t.id), obj:t, fixed:t.dueType === "Fixed day", by:t.dueType === "By", priority:t.priority });
  return out;
}
function todayList(){ return entries().filter(e => (e.fixed && e.date === TODAY) || (e.by && e.date === TODAY) || (!e.done && e.date && e.date < TODAY)).sort((a, b) => (a.done - b.done) || (a.date || "").localeCompare(b.date || "")); }
function weekList(){ const t = new Set(todayList().map(e => e.id));
  return entries().filter(e => !t.has(e.id) && ((e.fixed && e.date > TODAY && e.date <= weekEnd) || (e.by && e.date > TODAY) || (!e.fixed && !e.by))).sort((a, b) => (a.done - b.done) || (a.date || "9").localeCompare(b.date || "9")); }

function itemHtml(e){
  const late = !e.done && e.date && e.date < TODAY;
  const when = e.by ? "by " + nice(e.date) : e.date ? nice(e.date) : "this week";
  return `<div class="item ${e.done ? "done" : ""} ${late ? "late" : ""}" data-id="${e.id}" data-kind="${e.kind}">
    <div class="chk ${e.done ? "on" : ""}" data-tick="${e.id}"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></div>
    <div><div class="t">${esc(e.title)}</div>${e.sub ? `<div class="s">${esc(e.sub)}</div>` : ""}</div>
    <div class="meta">${late ? `<span class="pill bad">overdue</span>` : ""}${e.priority === "High" ? `<span class="pill bad">high</span>` : ""}
      <span class="pill ${e.kind === "task" ? "gray" : pf(e.platform)}">${esc(e.kind === "task" ? e.platform || "Task" : e.platform)}</span>
      <span class="pill ${stCls(e.status)}">${esc(e.status)}</span><span class="when">${when}</span></div></div>`;
}
function wireTicks(){
  document.querySelectorAll("[data-tick]").forEach(c => c.onclick = ev => { ev.stopPropagation(); const id = c.dataset.tick; DONE.has(id) ? DONE.delete(id) : DONE.add(id);
    localStorage.setItem("nf_done", JSON.stringify([...DONE])); fetch("/portal/done", { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({ id, done: DONE.has(id) }) }).catch(() => {}); route(); });
  document.querySelectorAll(".item[data-kind=plan]").forEach(el => el.onclick = () => openPlan(el.dataset.id));
}

// ---------- pages ----------
function home(){
  const td = todayList(), wk = weekList(), open = td.filter(e => !e.done).length, late = td.filter(e => !e.done && e.date && e.date < TODAY).length;
  const fNow = A.reduce((s, a) => s + (a.followers || 0), 0); const g = A.map(a => gain(a, 7)).filter(v => v != null); const fg = g.length ? g.reduce((s, v) => s + v, 0) : null;
  const views7 = A.reduce((s, a) => s + days(7).reduce((t, d) => t + (a.viewsDaily[d] || 0), 0), 0);
  const published = P.filter(p => p.status === "Published" && p.date >= weekStart).length, planned = P.filter(p => p.date >= weekStart && p.date <= weekEnd).length;
  const hour = new Date().getHours(), greet = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
  $("#main").innerHTML = `
    <span class="eyebrow">${nice(TODAY)} · ${M.shootDays.includes(dow(TODAY)) ? "shoot day" : "no shoot today"}</span>
    <h1>${greet}, <em>${esc(M.name)}.</em></h1>
    <p class="lead">${open === 0 ? "Nothing left for today. " : `${open} thing${open === 1 ? "" : "s"} for today${late ? `, <b style="color:var(--bad)">${late} overdue</b>` : ""}. `}${wk.filter(e => !e.done).length} more this week.</p>
    <div class="kpis">
      <div class="card kpi"><div class="l">Followers, all accounts</div><div class="v">${fmt(fNow)}</div><div class="d ${fg > 0 ? "up" : fg < 0 ? "down" : ""}">${fg == null ? "growth shows from day 2" : sgn(fg) + " last 7 days"}</div></div>
      <div class="card kpi"><div class="l">Views, last 7 days</div><div class="v">${fmt(views7)}</div><div class="d">across ${A.length} accounts</div></div>
      <div class="card kpi"><div class="l">This week</div><div class="v">${published}/${planned}</div><div class="d">published / planned</div></div>
      <div class="card kpi"><div class="l">Open tasks</div><div class="v">${T.filter(t => t.status !== "Done" && !DONE.has(t.id)).length}</div><div class="d">${T.filter(t => t.priority === "High" && t.status !== "Done" && !DONE.has(t.id)).length} high priority</div></div>
    </div>
    <section class="sec"><div class="sec-head"><div><h2>Today</h2><div class="cs">Tick it off when it's done. Your team sees it right away.</div></div></div>
      <div class="list">${td.map(itemHtml).join("") || `<div class="empty">Nothing scheduled for today.</div>`}</div></section>
    <section class="sec"><div class="sec-head"><div><h2>This <em>week</em></h2><div class="cs">Deadlines and open points until ${nice(weekEnd)}</div></div><a class="btn" href="#plan">Full plan →</a></div>
      <div class="list">${wk.map(itemHtml).join("") || `<div class="empty">Nothing else this week.</div>`}</div></section>
    <section class="sec"><div class="sec-head"><div><h2>Your <em>reels</em></h2><div class="cs">Latest first. Tap to watch here.</div></div><a class="btn" href="#reels">All reels →</a></div>
      <div class="reels">${reelCards().slice(0, 5).join("") || `<div class="empty">No reels yet.</div>`}</div></section>`;
  wireTicks(); wireReels();
}

function reelCards(){
  const out = [];
  for (const p of P.filter(p => p.type === "Reel" || p.file)) out.push({ k: p.date || "", html: `<a class="reel" data-plan="${p.id}">${p.file?.thumb ? `<img src="${esc(p.file.thumb)}" alt="">` : p.file?.type?.startsWith("video") ? `<video src="${esc(p.file.url)}" muted playsinline preload="metadata"></video>` : ""}
      <span class="pill ${stCls(p.status)} tag">${esc(p.status)}</span><div class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
      <div class="ov"><b>${esc(p.title)}</b><span>${esc(p.platform)}</span><span>${p.date ? nice(p.date) : ""}</span></div></a>` });
  for (const a of A) for (const r of a.reels) out.push({ k: "0", views: r.views, html: `<a class="reel" data-ig="${esc(r.code)}">${r.thumb ? `<img src="${esc(r.thumb)}" alt="" loading="lazy">` : ""}
      <span class="pill ok tag">live</span><div class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
      <div class="ov"><b>@${esc(a.handle)}</b><span>▶ ${fmt(r.views)}</span><span>♥ ${fmt(r.likes)}</span></div></a>` });
  return out.sort((x, y) => y.k.localeCompare(x.k) || (y.views || 0) - (x.views || 0)).map(x => x.html);
}
function wireReels(){ document.querySelectorAll(".reel[data-plan]").forEach(el => el.onclick = () => openPlan(el.dataset.plan)); document.querySelectorAll(".reel[data-ig]").forEach(el => el.onclick = () => openIg(el.dataset.ig)); }
function reels(){
  $("#main").innerHTML = `<span class="eyebrow">Reels</span><h1>Watch, <em>don't switch apps.</em></h1><p class="lead">Your planned and published reels in one place. Live ones play straight from Instagram.</p>
    <div class="reels">${reelCards().join("") || `<div class="empty">No reels yet.</div>`}</div>`; wireReels();
}
function media(p){
  if (p.file?.type?.startsWith("video")) return `<video src="${esc(p.file.url)}" controls autoplay playsinline></video>`;
  if (p.file?.url) return `<img src="${esc(p.file.url)}" alt="">`;
  const code = (p.published || p.reference || "").match(/\/(?:reel|p)\/([A-Za-z0-9_-]+)/);
  if (code) return `<iframe src="https://www.instagram.com/reel/${code[1]}/embed/" allowfullscreen></iframe>`;
  return `<div style="color:var(--muted);padding:20px;text-align:center">No file yet.<br>Upload it after the shoot and it plays here.</div>`;
}
function openPlan(id){ const p = P.find(x => x.id === id); if (!p) return;
  $("#modalBox").innerHTML = `<div class="media">${media(p)}</div><div class="body"><span class="pill ${pf(p.platform)}">${esc(p.platform)}</span> <span class="pill ${stCls(p.status)}">${esc(p.status)}</span>
    <h3>${esc(p.title)}</h3><div style="color:var(--muted)">${esc(p.type)}${p.date ? " · " + nice(p.date) : ""}</div>
    ${p.hook ? `<div class="k">Hook / idea</div><div>${esc(p.hook)}</div>` : ""}${p.outfit ? `<div class="k">Outfit / location</div><div>${esc(p.outfit)}</div>` : ""}
    ${p.caption ? `<div class="k">Caption</div><div style="white-space:pre-wrap">${esc(p.caption)}</div>` : ""}${p.notes ? `<div class="k">Notes</div><div>${esc(p.notes)}</div>` : ""}
    <div style="display:flex;gap:8px;margin-top:20px;flex-wrap:wrap">${p.reference ? `<a class="btn" href="${esc(p.reference)}" target="_blank" rel="noopener">Reference ↗</a>` : ""}${p.published ? `<a class="btn" href="${esc(p.published)}" target="_blank" rel="noopener">Open on ${esc(p.platform)} ↗</a>` : ""}</div></div>`;
  $("#modal").classList.add("on"); }
function openIg(code){ $("#modalBox").innerHTML = `<div class="media"><iframe src="https://www.instagram.com/reel/${esc(code)}/embed/" allowfullscreen></iframe></div><div class="body"><span class="pill ok">live</span><h3>Published reel</h3><div style="color:var(--muted)">Playing from Instagram</div><div style="margin-top:20px"><a class="btn" href="https://www.instagram.com/reel/${esc(code)}/" target="_blank" rel="noopener">Open on Instagram ↗</a></div></div>`; $("#modal").classList.add("on"); }
function closeModal(){ $("#modal").classList.remove("on"); $("#modalBox").innerHTML = ""; }
$("#modal").onclick = e => { if (e.target.id === "modal") closeModal(); };

let planView = "week";
function plan(){
  const ws = planView === "week" ? weekStart : addDays(weekStart, 7);
  const dayCols = [...Array(7)].map((_, i) => addDays(ws, i));
  const cell = k => { const ev = entries().filter(e => e.date === k && (e.fixed || e.by)); return `<div class="day ${k === TODAY ? "today" : ""}"><div class="dn">${dow(k)}</div><div class="dd">${k.slice(8)}</div>
      ${ev.map(e => `<div class="e ${e.kind === "task" ? "task" : pf(e.platform)} ${e.done ? "done" : ""}" ${e.kind === "plan" ? `data-open="${e.id}"` : ""}>${esc(e.title)}</div>`).join("")}${M.shootDays.includes(dow(k)) ? `<span class="shoot">● shoot day</span>` : ""}</div>`; };
  const rows = P.slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  $("#main").innerHTML = `<span class="eyebrow">Content plan</span><h1>What's <em>coming up.</em></h1><p class="lead">Your week at a glance, then everything in the plan.</p>
    <div class="sec-head"><h2>${planView === "week" ? "This" : "Next"} <em>week</em></h2><div class="seg"><button class="${planView === "week" ? "on" : ""}" data-v="week">This week</button><button class="${planView === "next" ? "on" : ""}" data-v="next">Next week</button></div></div>
    <div class="week">${dayCols.map(cell).join("")}</div>
    <section class="sec"><div class="sec-head"><div><h2>Everything</h2><div class="cs">${P.length} entries</div></div></div>
      <div class="list">${rows.map(p => `<div class="item" data-open="${p.id}" style="grid-template-columns:1fr auto"><div><div class="t">${esc(p.title)}</div><div class="s">${esc([p.type, p.outfit, p.hook].filter(Boolean).join(" · "))}</div></div>
        <div class="meta"><span class="pill ${pf(p.platform)}">${esc(p.platform)}</span><span class="pill ${stCls(p.status)}">${esc(p.status)}</span><span class="when">${p.date ? nice(p.date) : ""}</span></div></div>`).join("") || `<div class="empty">No entries yet.</div>`}</div></section>`;
  document.querySelectorAll("[data-open]").forEach(el => el.onclick = () => openPlan(el.dataset.open));
  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { planView = b.dataset.v; plan(); });
}

function tasks(){
  const open = T.filter(t => t.status !== "Done" && !DONE.has(t.id)), done = T.filter(t => t.status === "Done" || DONE.has(t.id));
  const row = t => itemHtml({ kind:"task", id:t.id, date:t.due, title:t.title, sub:t.desc, platform:t.category, status:t.status, done:t.status === "Done" || DONE.has(t.id), fixed:t.dueType === "Fixed day", by:t.dueType === "By", priority:t.priority });
  $("#main").innerHTML = `<span class="eyebrow">Tasks</span><h1>Small things, <em>big difference.</em></h1><p class="lead">Everything your team asked for that isn't a piece of content.</p>
    <div class="list">${open.map(row).join("") || `<div class="empty">All done.</div>`}</div>
    ${done.length ? `<section class="sec"><div class="sec-head"><h2>Done</h2></div><div class="list">${done.map(row).join("")}</div></section>` : ""}`; wireTicks();
}

function chart(el, series, color){
  const W = 900, H = 220, Pd = { l:52, r:14, t:14, b:26 }; const pts = series.filter(p => p.v != null);
  if (pts.length < 2){ el.innerHTML = `<div class="empty">The curve appears after the second day of data.</div>`; return; }
  const xs = series.map((_, i) => Pd.l + i * (W - Pd.l - Pd.r) / (series.length - 1)); const vs = pts.map(p => p.v); let lo = Math.min(...vs), hi = Math.max(...vs); if (hi === lo){ hi += 1; lo -= 1; }
  const y = v => Pd.t + (H - Pd.t - Pd.b) * (1 - (v - lo) / (hi - lo));
  let d = "", first = true; series.forEach((p, i) => { if (p.v == null) return; d += (first ? "M" : "L") + xs[i].toFixed(1) + "," + y(p.v).toFixed(1); first = false; });
  const lastI = series.map((p, i) => p.v != null ? i : -1).filter(i => i >= 0).pop(), firstI = series.findIndex(p => p.v != null);
  const area = d + `L${xs[lastI].toFixed(1)},${H - Pd.b}L${xs[firstI].toFixed(1)},${H - Pd.b}Z`;
  const ticks = [lo, (lo + hi) / 2, hi];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g${color.slice(1)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t => `<line x1="${Pd.l}" x2="${W - Pd.r}" y1="${y(t)}" y2="${y(t)}" stroke="#262c38"/><text x="${Pd.l - 8}" y="${y(t) + 4}" fill="#9aa3b2" font-size="11" text-anchor="end">${fmt(t)}</text>`).join("")}
    <path d="${area}" fill="url(#g${color.slice(1)})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>
    <text x="${xs[firstI]}" y="${H - 8}" fill="#9aa3b2" font-size="11">${series[firstI].d.slice(5)}</text><text x="${xs[lastI]}" y="${H - 8}" fill="#9aa3b2" font-size="11" text-anchor="end">${series[lastI].d.slice(5)}</text></svg>`;
}
function accounts(){
  const win = days(30);
  const fS = win.map(d => ({ d, v: A.every(a => folOn(a, d) == null) ? null : A.reduce((s, a) => s + (folOn(a, d) || 0), 0) }));
  const vS = win.map(d => ({ d, v: A.some(a => d in a.viewsDaily) ? A.reduce((s, a) => s + (a.viewsDaily[d] || 0), 0) : null }));
  const list = A.slice().sort((x, y) => (y.followers || 0) - (x.followers || 0));
  $("#main").innerHTML = `<span class="eyebrow">Accounts</span><h1>Your <em>numbers.</em></h1><p class="lead">Every account your team runs for you. Updated daily, no screenshots needed.</p>
    <div class="grid2"><div class="card"><h2 style="font-size:20px">Followers</h2><div class="cs" style="color:var(--muted);font-size:13px;margin-bottom:8px">All accounts, last 30 days</div><div class="chart" id="cF"></div></div>
      <div class="card"><h2 style="font-size:20px">Views gained</h2><div class="cs" style="color:var(--muted);font-size:13px;margin-bottom:8px">New views per day</div><div class="chart" id="cV"></div></div></div>
    <section class="sec">${list.map(a => { const g = gain(a, 7); return `<div class="acc">${avatar(a)}<div><b>@${esc(a.handle)}</b><div style="color:var(--muted);font-size:12.5px">${a.posts != null ? a.posts + " posts" : ""}</div></div>
      <div><div class="lbl">Followers</div><div class="val">${fmt(a.followers)}</div></div><div><div class="lbl">7 days</div><div class="val ${g > 0 ? "up" : g < 0 ? "down" : ""}">${sgn(g)}</div></div>
      <div><div class="lbl">Views</div><div class="val">${fmt(a.totalViews)}</div></div><div style="text-align:right"><span class="st ${a.status}">${esc({ active:"Active", inactive:"Inactive", banned:"Banned", check:"Check" }[a.status] || a.status)}</span></div></div>`; }).join("") || `<div class="empty">No accounts yet.</div>`}</section>`;
  chart($("#cF"), fS, "#ff5c9a"); chart($("#cV"), vS, "#ff9ec4");
}

const pages = { home, plan, reels, tasks, accounts };
const LABEL = { home:"Today", plan:"Plan", reels:"Reels", tasks:"Tasks", accounts:"Accounts" };
function route(){ const p = (location.hash.slice(1) || "home").split("/")[0]; (pages[p] || home)();
  $("#tabs").innerHTML = Object.keys(pages).map(k => `<a href="#${k}" class="${k === p ? "on" : ""}">${LABEL[k]}</a>`).join(""); window.scrollTo(0, 0); }
$("#meName").textContent = M.name; $("#meDot").textContent = M.name.slice(0, 1).toUpperCase();
window.addEventListener("hashchange", route); route();
</script>
</body></html>
