  let d = "", first = true; series.forEach((p, i) => { if (p.v == null) return; d += (first ? "M" : "L") + xs[i].toFixed(1) + "," + y(p.v).toFixed(1); first = false; });
  const lastI = series.map((p, i) => p.v != null ? i : -1).filter(i => i >= 0).pop(), firstI = series.findIndex(p => p.v != null);
  const area = d + `L${xs[lastI].toFixed(1)},${H - Pd.b}L${xs[firstI].toFixed(1)},${H - Pd.b}Z`;
  const ticks = hi - lo >= 2 ? [lo, Math.round((lo + hi) / 2), hi] : [lo, hi];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t => `<line x1="${Pd.l}" x2="${W - Pd.r}" y1="${y(t)}" y2="${y(t)}" stroke="#262c38"/><text x="${Pd.l - 8}" y="${y(t) + 4}" fill="#9aa3b2" font-size="11" text-anchor="end">${fmt(t)}</text>`).join("")}
    <path d="${area}" fill="url(#g1)"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>
    ${series.map((p, i) => (i === 0 || i === series.length - 1 || (series.length > 10 && i % Math.ceil(series.length / 6) === 0)) ? `<text x="${xs[i]}" y="${H - 8}" fill="#9aa3b2" font-size="11" text-anchor="${i === 0 ? "start" : i === series.length - 1 ? "end" : "middle"}">${nice(p.d).replace(/^[^ ]+ /, "")}</text>` : "").join("")}</svg>`;
}
function accounts(){
  const firstDay = [...new Set(A.flatMap(a => Object.keys(a.followersDaily)))].sort()[0];
  const span = firstDay ? Math.min(30, Math.max(2, Math.round((new Date(TODAY) - new Date(firstDay)) / 864e5) + 1)) : 30;
  const win = days(span);
  const fS = win.map(d => ({ d, v: A.every(a => folOn(a, d) == null) ? null : A.reduce((s, a) => s + (folOn(a, d) || 0), 0) }));
  const list = A.slice().sort((x, y) => (y.followers || 0) - (x.followers || 0));
  $("#main").innerHTML = `<span class="eyebrow">${L.accEyebrow}</span><h1>${L.accH}</h1><p class="lead">${L.accSub}</p>
    <div class="card"><h2 style="font-size:20px">${L.folChart}</h2><div style="color:var(--muted);font-size:13px;margin-bottom:8px">${L.folChartSub(span)}</div><div class="chart" id="cF"></div></div>
    <section class="sec">${list.map(a => { const g = gain(a, 7); return `<div class="acc">${avatar(a)}<div><b>@${esc(a.handle)}</b><div style="color:var(--muted);font-size:12.5px">${a.posts != null ? a.posts + " " + L.posts : ""}</div></div>
      <div><div class="lbl">${L.folChart}</div><div class="val">${fmt(a.followers)}</div></div><div><div class="lbl">${L.d7}</div><div class="val ${g > 0 ? "up" : g < 0 ? "down" : ""}">${sgn(g)}</div></div><div></div></div>`; }).join("") || `<div class="empty">${L.noAcc}</div>`}</section>`;
  chart($("#cF"), fS, "#ff5c9a");
}

const pages = { home, plan, accounts };
const KEY = { home:"today", plan:"plan", reels:"reels", tasks:"tasks", accounts:"accounts" };
function route(){ const p = (location.hash.slice(1) || "home").split("/")[0]; L = I18N[LANG]; document.documentElement.lang = LANG; (pages[p] || home)();
  $("#tabs").innerHTML = Object.keys(pages).map(k => `<a href="#${k}" class="${k === p ? "on" : ""}">${L[KEY[k]]}</a>`).join("");
  window.scrollTo(0, 0); fitNav(); }
// measured, not guessed: full wordmark while logo + tabs + avatar fit in one row, the N mark otherwise
function fitNav(){ const nav = $(".nav"); nav.classList.remove("compact");
  const need = [...nav.children].reduce((w, el) => w + el.getBoundingClientRect().width, 0) + 18 * (nav.children.length - 1);
  const have = nav.clientWidth - parseFloat(getComputedStyle(nav).paddingLeft) - parseFloat(getComputedStyle(nav).paddingRight);
  if (need > have) nav.classList.add("compact"); }
window.addEventListener("resize", fitNav); if (document.fonts) document.fonts.ready.then(fitNav);
$("#meName").textContent = M.name; $("#meDot").textContent = M.name.slice(0, 1).toUpperCase();
window.addEventListener("hashchange", route); route();
</script>
