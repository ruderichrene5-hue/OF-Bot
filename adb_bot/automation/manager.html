function addDays(k, n){ const d = new Date(k + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }
function weekStart(k){ const d = new Date(k + "T12:00:00Z"); const wd = (d.getUTCDay() + 6) % 7; return addDays(k, -wd); }

async function api(action, body){

  return j;
}

// 22.11 Rene: task texts keep their lines; "1. …" = step heading, "- …" = bullet
function richText(s){
  const out = []; let ul = false, inStep = false;
  for (const raw of String(s || "").split("\n")) {
    const l = raw.trim();
    const li = l.match(/^[-•]\s+(.*)$/), h = l.match(/^(\d+)\.\s+(.*)$/);
    if (li) { if (!ul) { out.push('<ul class="rt-ul">'); ul = true; } out.push(`<li>${esc(li[1])}</li>`); continue; }
    if (ul) { out.push("</ul>"); ul = false; }
    if (!l) continue;
    if (h) inStep = true;
    out.push(h ? `<div class="rt-h"><span>${h[1]}</span>${esc(h[2])}</div>` : `<div class="${inStep && !/^(Abhaken|Tick it off)/.test(l) ? "rt-q" : "rt-p"}">${esc(l)}</div>`);
  }
  if (ul) out.push("</ul>");
  // 22.11 Rene: long instructions start folded – intro stays visible, the steps open on click
  const steps = out.filter(x => x.startsWith('<div class="rt-h">')).length;
  let cut = out.findIndex(x => x.startsWith('<div class="rt-h">'));
  if (cut < 0) cut = out.length > 4 ? 1 : out.length;
  if (cut >= out.length) return `<div class="rt">${out.join("")}</div>`;
  if (cut > 2) cut = 1;
  if (cut && !out[0].startsWith('<div class="rt-p"')) cut = 0;   // never split a list
  return `<div class="rt">${out.slice(0, cut).join("")}<details class="rt-more" onclick="event.stopPropagation()"><summary><span class="c">${"Anleitung anzeigen"}${steps ? " · " + steps + " " + "Schritte" : ""}</span><span class="o">${"Anleitung ausblenden"}</span></summary>${out.slice(cut).join("")}</details></div>`;
}
function fileHtml(f){
  if (Array.isArray(f)) f = f[0];
  if (!f || !f.url) return "";
  const img = (f.type || "").startsWith("image");
  return `<div class="rt-file">${img ? `<a href="${esc(f.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()"><img src="${esc(f.thumb || f.url)}" alt=""></a>` : ""}<a class="rt-dl" href="${esc(f.url)}" target="_blank" rel="noopener" download onclick="event.stopPropagation()">⬇ ${img ? "Bild herunterladen" : "Datei herunterladen"}</a></div>`;
}

async function doCopy(kind, ids){

      else { const t = D.tasks.find(x => x.id === i);
        await api("task.create", {model:m, category:t.category, title:t.title, dueType:t.dueType, due:t.due, priority:t.priority, status:"Open", assigned:t.assigned, visible:t.visible, desc:t.desc}); }
      n++; }
    closeModal(); toast(`${n} Eintr${n === 1 ? "ag" : "äge"} kopiert`); reloadLater(); }
  catch(e){ $("#cp_err").textContent = e.message; $("#cp_go").disabled = false; }

async function setStage(id, stage){

  if (stage === "Beendet" && !(await ask(`${m.name} beenden?`, "Der Portal-Zugang wird gesperrt.", {ok:"Beenden", danger:true}))) return;
  if (stage === "Vertrag offen" && !m.contractSigned) { await sendContract(id); return; }            // C: the column means "contract is out"
  if (["Unterschrieben","Onboarding","Aktiv"].includes(stage) && !m.contractSigned && !m.welcomeSent) {  // E: no contract, no welcome mail yet
    const go = await ask(`${m.name} hat keinen unterschriebenen Vertrag`, "Soll sie trotzdem ihren Portal-Zugang per Mail bekommen? Das ist der Weg für bestehende Models ohne Vertrag.", {ok:"Zugang senden und verschieben", alt:"Nur verschieben"});

  catch(e){ Object.assign(m, before); route(); toast("Nicht gespeichert: " + e.message, true); }
}

  const m = modelById(id); if (!m.email) { openModelForm(id); toast("Erst eine E-Mail eintragen", true); return; }
  const before = m.stage; m.stage = stage && !["Unterschrieben"].includes(stage) ? stage : "Onboarding"; route();
  try { const r = await api("model.access", {id}); if (stage && stage !== r.stage && stage !== "Unterschrieben") await api("model.stage", {id, stage});
    if (!r.mailed) toast("Zugang angelegt, Mail ging nicht raus (Einstellungen prüfen)", true); else waAfter(m, "Zugang ist raus", `Per Mail an ${m.email} · Drive-Ordner wird angelegt.`, WA_TEXT["Zugang"](m)); reloadLater(); }
  catch(e){ m.stage = before; route(); toast("Fehler: " + e.message, true); }
}

async function chStage(id, st, name){
  const txt = {"Test shift":"Er bekommt eine Mail: Test bestanden, Testschicht folgt.","Active":"Er bekommt die Willkommensmail mit Discord-Link.","Rejected":"Er bekommt eine freundliche Absage, der Portal-Zugang endet.","Contract":"Der englische Vertrag geht sofort per DocuSeal raus (du unterschreibst automatisch). Nach seiner Unterschrift wird er automatisch aktiv und bekommt die Discord-Einladung.","Course":"Zugang wieder offen, er startet beim Kurs."}[st] || "";
  if (!(await ask(`${name}: ${st}?`, txt, {ok:"Ja", danger: st === "Rejected"}))) return;
  try { const r = await api("chatter.stage", {id, stage: st}); toast(r.mailed ? "Gespeichert, Mail ist raus" : "Gespeichert"); await loadChatter(); } catch(e){ toast("Fehler: " + e.message, true); }

async function chEdit(id){
  const c = CH.chatters.find(x => x.id === id); if (!c) return;
  const sh = await ask("Schicht", "z. B. Mon–Sat 08:00–16:00 (Sun off) oder Shift 2", {input: c.shift || "", ok:"Weiter"}); if (sh === null) return;
  const opts = CH.models.map(m => m.name).join(", ");
  const ms = await ask("Creator", "Namen mit Komma trennen. Verfügbar: " + opts, {input: c.models.map(m => m.name).join(", "), ok:"Speichern"}); if (ms === null) return;
  const ids = ms.split(",").map(x => x.trim().toLowerCase()).filter(Boolean).map(n => (CH.models.find(m => m.name.toLowerCase() === n) || {}).id).filter(Boolean);
  try { await api("chatter.update", {id, shift: sh, models: ids}); toast("Gespeichert"); await loadChatter(); } catch(e){ toast("Fehler: " + e.message, true); }
}

async function dropCard(ev, stage){ ev.preventDefault(); const d = DRAG; DRAG = null; if (!d) return;
  if (d.kind === "model") { const m = modelById(d.id); if ((m.stage || "Bewerbung") !== stage) await setStage(d.id, stage); return; }
  if (d.kind === "app") { if (stage === "Bewerbung") return; await acceptAppTo(d.id, stage); } }
async function acceptAppTo(id, stage){ const a = D.applications.find(x => x.id===id); if (!a) return;
  const name = [a.firstName,a.lastName].filter(Boolean).join(" ") || a.instagram || (a.email || "").split("@")[0] || "Neues Model";
  try { const r = await api("model.create", {name, email:a.email, language:(a.lang||"de").toUpperCase()==="DE"?"DE":"EN", whatsapp:a.phone || "", stage: stage === "Vertrag offen" ? "Call gebucht" : stage, generatePassword:true});
    a.status = "accepted"; D.models.push({id:r.id, name, email:a.email || "", language:(a.lang||"de").toUpperCase()==="DE"?"DE":"EN", whatsapp:a.phone || "", stage: stage === "Vertrag offen" ? "Call gebucht" : stage, status:"Onboarding", package:"Full Management", hasPassword:true, accountsMode:"Nein"});
    closeModal(); toast(`${name} ist jetzt ein Model (${stage})`); location.hash = "model/" + r.id;
    api("app.status", {id, status:"accepted", model:name}).then(reloadLater).catch(() => {});
    if (stage === "Vertrag offen") setTimeout(() => sendContract(r.id), 200); }
  catch(e){ toast("Fehler: " + e.message, true); } }

async function saveModel(id, appId, stage){
  const body = {name:val("m_name"), email:val("m_email"), language:val("m_language"), password:val("m_password"), package:val("m_package"), whatsapp:val("m_whatsapp"),
    legalName:val("m_legalName"), birthdate:val("m_birthdate"), street:val("m_street"), zip:val("m_zip"), city:val("m_city"), country:val("m_country")};
  if (stage) body.stage = stage;
  if (!body.name) { $("#m_err").textContent = "Name fehlt."; return; }
  $("#m_save").disabled = true;
  try {
    let pw = "";
    if (id) { body.id = id; await api("model.update", body); }
    else { body.generatePassword = true; const r = await api("model.create", body); pw = r.password;
      // 15.11 Rene "Anlegen dauert": show the new model at once, refresh in the background
      D.models.push(Object.assign({id:r.id, status:"Onboarding", stage: stage || "Onboarding", package: body.package || "Full Management", hasPassword:true, accountsMode:"Nein"}, body));
      if (appId) { const a = D.applications.find(x => x.id === appId); if (a) a.status = "accepted"; api("app.status", {id:appId, status:"accepted", model:body.name}).catch(() => {}); } }
    closeModal(); if (id) Object.assign(modelById(id), body); route(); reloadLater();
    toast(id ? "Model gespeichert" : "Model angelegt");
    if (!id && pw) openModal(`<button class="x" onclick="closeModal()">×</button><h2>${esc(body.name)} ist angelegt</h2><p style="color:var(--muted)">Login für das Portal (portal.northfeed-management.com):</p><div class="card" style="font-size:15px"><b>E-Mail</b> ${esc(body.email || "— noch keine E-Mail eingetragen")}<br><b>Passwort</b> <code style="font-size:16px">${esc(pw)}</code></div><p style="color:var(--muted);font-size:13px;margin-top:12px">Nach der Unterschrift geht das Passwort automatisch mit der Willkommensmail raus. Bei einem Model ohne Vertrag schickst du es per WhatsApp.</p><div class="foot"><button class="btn p" onclick="closeModal()">Fertig</button></div>`);
  } catch(e) { $("#m_err") && ($("#m_err").textContent = e.message); $("#m_save") && ($("#m_save").disabled = false); toast("Fehler: " + e.message, true); }
}
function openPlanForm(modelId, id){
  const p = id ? D.plan.find(x => x.id===id) : {model: modelId || "", date: TODAY, platform:"Instagram", type:"Reel", status:"Planned"};
  openModal(`<button class="x" onclick="closeModal()">×</button><h2>${id ? "Plan-Eintrag bearbeiten" : "Plan-Eintrag anlegen"}</h2>
    <div class="f"><label class="w"><span>Model *</span>${modelChips("p_model", p.model || (activeModels()[0]||{}).id)}</label><label><span>Datum</span><input type="date" id="p_date" value="${esc(p.date)}"></label>
    <label class="w"><span>Titel *</span><input type="text" id="p_title" value="${esc(p.title)}" placeholder="z. B. Reel: Mein Morgen ohne Handy"></label>
    <label class="w"><span>Plattform</span>${chips("p_platform", D.options.platform, p.platform)}</label><label class="w"><span>Typ</span>${chips("p_type", D.options.type, p.type)}</label>
    <label class="w"><span>Status</span>${chips("p_status", D.options.planStatus, p.status)}</label><label><span>Outfit / Ort</span><input type="text" id="p_outfit" value="${esc(p.outfit)}"></label>
    <label class="w"><span>Hook / Idee (die ersten 3 Sekunden, oder die Idee in 1–2 Sätzen)</span><textarea id="p_hook">${esc(p.hook)}</textarea></label>
    <label class="w"><span>Referenz-Link (Reel, an dem sich das orientiert; wird im Portal abgespielt)</span><input type="url" id="p_reference" value="${esc(p.reference)}" placeholder="https://www.instagram.com/reel/…"></label>
    <label class="w"><span>Caption</span><textarea id="p_caption">${esc(p.caption)}</textarea></label>
    <label><span>Veröffentlicht-Link</span><input type="url" id="p_published" value="${esc(p.published)}"></label><label><span>Notizen</span><input type="text" id="p_notes" value="${esc(p.notes)}"></label></div>
    <div class="foot"><span class="err" id="p_err"></span><button class="btn" onclick="closeModal()">Abbrechen</button><button class="btn p" id="p_save" onclick="savePlan(${id?`'${id}'`:"null"})">Speichern</button></div>`);
}
async function savePlan(id){
  const body = {model:val("p_model"), date:val("p_date"), title:val("p_title"), platform:val("p_platform"), type:val("p_type"), status:val("p_status"), outfit:val("p_outfit"), hook:val("p_hook"), reference:val("p_reference"), caption:val("p_caption"), published:val("p_published"), notes:val("p_notes")};
  if (!body.title || !body.model) { $("#p_err").textContent = "Model und Titel fehlen."; return; }
  $("#p_save").disabled = true;
  try { if (id) { body.id = id; await api("plan.update", body); } else await api("plan.create", body); closeModal(); toast("Plan gespeichert"); reloadLater(); }
  catch(e) { $("#p_err").textContent = e.message; $("#p_save").disabled = false; }
}
function openTaskForm(modelId, id, who){
  const t = id ? D.tasks.find(x => x.id===id) : {model: modelId || (who === "Team" && D.models[0] ? D.models.filter(m=>m.status!=="Ended")[0].id : ""), status:"Open", priority:"Medium", assigned:who || "Model", dueType:"Fixed day", visible:(who || "Model") === "Model", due:TODAY};
  openModal(`<button class="x" onclick="closeModal()">×</button><h2>${id ? "Aufgabe bearbeiten" : "Aufgabe anlegen"}</h2>
    <div class="f"><label class="w"><span>Model *</span>${modelChips("t_model", t.model || (activeModels()[0]||{}).id)}</label><label class="w"><span>Kategorie</span>${chips("t_category", D.options.category, t.category || "Content")}</label>
    <label class="w"><span>Aufgabe *</span><input type="text" id="t_title" value="${esc(t.title)}" placeholder="z. B. Profilbild aktualisieren"></label>
    <label><span>Fälligkeit</span>${chips("t_dueType", D.options.dueType, t.dueType)}</label><label><span>Datum</span><input type="date" id="t_due" value="${esc(t.due)}"></label>
    <label><span>Priorität</span>${chips("t_priority", D.options.priority, t.priority)}</label><label><span>Status</span>${chips("t_status", D.options.taskStatus, t.status)}</label>
    <label><span>Zuständig</span>${chips("t_assigned", [["Model","Model"],["Team","Ich / Team"]], t.assigned === "Team" ? "Team" : "Model")}</label><label class="chk" style="align-self:end"><input type="checkbox" id="t_visible" ${t.visible?"checked":""}> Im Portal sichtbar</label>
    <label class="w"><span>Beschreibung (das sieht das Model)</span><textarea id="t_desc">${esc(t.desc)}</textarea></label></div>
    <div class="foot"><span class="err" id="t_err"></span><button class="btn" onclick="closeModal()">Abbrechen</button><button class="btn p" id="t_save" onclick="saveTask(${id?`'${id}'`:"null"})">Speichern</button></div>`);
}
async function saveTask(id){
  const body = {model:val("t_model"), category:val("t_category"), title:val("t_title"), dueType:val("t_dueType"), due:val("t_dueType")==="This week"?"":val("t_due"), priority:val("t_priority"), status:val("t_status"), assigned:val("t_assigned"), visible:val("t_visible"), desc:val("t_desc")};
  if (!body.title || !body.model) { $("#t_err").textContent = "Model und Aufgabe fehlen."; return; }
  $("#t_save").disabled = true;
  try { if (id) { body.id = id; await api("task.update", body); } else await api("task.create", body); closeModal(); toast("Aufgabe gespeichert"); reloadLater(); }
  catch(e) { $("#t_err").textContent = e.message; $("#t_save").disabled = false; }
}

// ---------- router ----------
const TABS = [["home","Übersicht"],["pipeline","Bewerbungen"],["tasks","Aufgaben"],["abrechnung","Abrechnung"]];   // 19.11 Rene: Content-Plan lives on each model   // 18.11 Rene: chatter live in the overview, under the models
const MENU = [["kurse","Kurse"],["skripte","Skripte"],["tools","Tools"],["einstellungen","Einstellungen"]];   // 18.11 behind the avatar
let SETUP_OPEN = 0;
function renderMe(p){
  const n = SETUP_OPEN ? `<span class="n">${SETUP_OPEN}</span>` : "";
  $("#meMenu").innerHTML = `<div class="who"><b>${esc(D.manager.name || "Manager")}</b>Northfeed Manager</div>` +
    MENU.map(([k,l]) => `<a href="#${k}" class="${p===k?"on":""}">${l}${k==="einstellungen"?n:""}</a>`).join("") + `<hr><a href="/logout">Logout</a>`;
  $("#me").classList.toggle("on", MENU.some(([k]) => k === p));
  const bd = $("#meBadge"); bd.hidden = !SETUP_OPEN; bd.textContent = SETUP_OPEN || "";
}
function route(){
  const parts = (location.hash.slice(1) || "home").split("/"); const p = parts[0];
  const newApps = D.applications.filter(a => a.status === "new").length;
  $("#tabs").innerHTML = TABS.map(([k,l]) => `<a href="#${k}" class="${(p===k||((p==="model"||p==="chatter")&&k==="home")||(p==="apps"&&k==="pipeline"))?"on":""}">${l}${k==="pipeline"&&newApps?`<span class="n">${newApps}</span>`:""}</a>`).join("") + MENU.map(([k,l]) => `<a class="mob ${p===k?"on":""}" href="#${k}">${l}</a>`).join("") + `<a class="mob" href="/logout">Logout</a>`;
  $("#meDot").textContent = (D.manager.name || "M").slice(0,1).toUpperCase(); renderMe(p);
  const mnt = document.getElementById("courseMount"), hold = document.getElementById("courseAdminHolder");
  if (mnt && hold) { while (mnt.firstChild) hold.appendChild(mnt.firstChild); }
  if (p === "model") pages.model(parts[1]); else (pages[p] || pages.home)();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
setTimeout(() => {                                             // 16.11 "warum lädt das": fetch the slower tabs in the background right after start
  if (!BILL) api("billing.overview", {}).then(o => { BILL = o; if ($("#billMount")) renderBilling(); }).catch(() => {});
  if (!SC) api("scripts.list", {}).then(o => { SC = o; if ($("#scMount") && !$("#scEdit")) renderScripts(); }).catch(() => {});
}, 400);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
route();

document.addEventListener("click", e => { const nav = document.querySelector(".nav"); if (!nav) return;
  if (e.target.closest(".burger")) { nav.classList.toggle("open"); return; }
  const me = $("#me"); if (me) { if (e.target.closest("#meMenu a")) me.classList.remove("open"); else if (e.target.closest("#me")) me.classList.toggle("open"); else me.classList.remove("open"); }
  if (e.target.closest(".nav .tabs a")) nav.classList.remove("open"); });
</script>
</body></html>
