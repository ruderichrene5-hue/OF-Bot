<style>

  label small.hint,.w small.hint{display:block;font-size:12px;color:var(--muted);opacity:.8;margin:-2px 0 6px} input:disabled{opacity:.45}
  .teamb{margin-top:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--muted);border-radius:999px;padding:7px 12px;font:600 13px var(--sans);cursor:pointer}

  .btn.p{background:var(--pink);border-color:var(--pink);color:#fff} .btn:disabled{opacity:.5;cursor:default}
  .foot{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:14px;flex-wrap:wrap} .err{color:var(--bad);font-size:13px;margin-right:auto} .okm{color:#7ee098;font-size:13px;margin-right:auto}

  .cat .h{display:flex;justify-content:space-between;align-items:center;gap:10px} .cat .h b{font-size:15px} .cat .c{font-size:12.5px;color:var(--muted);margin:3px 0 10px}
  .bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0} .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--ice))}

  .thumbs button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:14px;padding:0}
  .up{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .up input[type=file]{display:none}
  .prog{font-size:12px;color:var(--muted)} .rules{font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 14px} .rules b{color:var(--fg)}
  .done{text-align:center;padding:30px 10px} .done .big{font-family:var(--display);font-size:34px;margin:8px 0}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1d2230;border:1px solid var(--line2);padding:10px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:50} .toast.show{opacity:1} .toast.bad{border-color:var(--bad)}
  @media (max-width:520px){ .step{padding:8px;gap:6px;font-size:12px} .step b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} }
.bk{display:inline-flex;vertical-align:middle;margin:0 14px 0 0;align-items:center;gap:9px;font-weight:600;font-size:14px;color:#c9cfdb;text-decoration:none;cursor:pointer;background:none;border:0;padding:0;font-family:inherit}.bk i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#1b2029;border:1px solid #343c4d;transition:background .15s,border-color .15s}.foot .bk{margin-bottom:0}.bk:hover{color:#fff}.bk:hover i{background:#ff5c9a;border-color:#ff5c9a}.bk:hover i svg{stroke:#fff}.bk svg{width:14px;height:14px;stroke:#ff9ec4;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

 DE:{eyebrow:"Willkommen bei Northfeed", h1:"Zwei Schritte, dann <em>legen wir los</em>.", lead:"Erst dein Steckbrief, dann deine Referenzbilder. Daraus baut unsere KI deine Reels, Bilder und deinen Chat-Stil. Du musst das nur einmal machen.",

let L = I18N[LANG];
const CONTENT = ["Lingerie","Topless","Nude","Explicit","Fetish","Couple","Customs","Sexting","Video-Calls"];
const V = Object.assign({}, D.steckbrief.values);
let view = D.steckbrief.done ? "done" : "sb";   // 16.11 Rene: the portal only takes the Steckbrief, every image goes up in Drive

function toast(m, bad){ const t = $("#toast"); t.textContent = m; t.className = "toast show" + (bad ? " bad" : ""); setTimeout(() => t.className = "toast", 2800); }
function setLang(l){ LANG = l; L = I18N[l]; document.documentElement.lang = l.toLowerCase(); render(); }
async function post(url, body){ const r = await fetch(url, {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify(body)}); const j = await r.json().catch(() => ({})); if (!r.ok || !j.ok) throw new Error(j.error || ("HTTP " + r.status)); return j; }

function stepsHtml(){
  const s = [["sb", L.s1, D.steckbrief.done], ["refs", L.s2, D.references.done], ["done", L.s3, D.complete]];
  return `<div class="steps">${s.map(([k,t,d],i) => `<div class="step ${d?"done":""} ${view===k?"cur":""}"><div class="n">${d?"✓":i+1}</div><b>${t}</b></div>`).join("")}</div>`;
}
function field(k, kind, opts){
  const hint = (L.hints||{})[k] ? `<small class="hint">${esc(L.hints[k])}</small>` : "";
  const lab = `<span>${esc(L.fields[k]).replace(" *", " <i>*</i>")}</span>${hint}`;
  const team = V[k] === "__team__", val = V[k] == null || team ? "" : V[k];
  if ((L.team||{})[k]) return `<div class="w"><label>${lab}<input type="${kind}" data-k="${k}" value="${esc(val)}" ${team?"disabled":""} ${kind==="number"?'inputmode="decimal"':""}></label>`
    + `<button type="button" class="teamb ${team?"on":""}" data-for="${k}" onclick="toggleTeam(this)">${esc(L.team[k])}</button></div>`;
  if (kind === "textarea") return `<label class="w">${lab}<textarea data-k="${k}">${esc(val)}</textarea></label>`;
  if (kind === "select") return `<div class="w">${lab}<div class="chips one" data-k="${k}" data-v="${esc(val)}">${opts.map(o => `<button type="button" class="${o===val?"on":""}" data-val="${esc(o)}" onclick="const g=this.parentElement;g.dataset.v=this.dataset.val;g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===this))">${esc((L.tonfall||{})[o] || o)}</button>`).join("")}</div></div>`;   // 15.11 Rene: buttons, no dropdowns
  if (kind === "chips") { const sel = Array.isArray(val) ? val : []; return `<div class="w">${lab}<div class="chips" data-k="${k}">${opts.map(o => `<button type="button" class="${sel.includes(o)?"on":""}" onclick="this.classList.toggle('on')">${esc(o)}</button>`).join("")}</div></div>`; }
  return `<label>${lab}<input type="${kind}" data-k="${k}" value="${esc(val)}" ${kind==="number"?'inputmode="decimal"':""}></label>`;

function toggleTeam(b){ const on = b.classList.toggle("on"), i = document.querySelector(`[data-k="${b.dataset.for}"]`); i.disabled = on; if (on) i.value = ""; else i.focus(); }
function collect(){
  const b = {};
  document.querySelectorAll("[data-k]").forEach(el => { const k = el.dataset.k; if (document.querySelector(`.teamb.on[data-for="${k}"]`)) b[k] = "__team__"; else if (el.classList.contains("chips") && el.classList.contains("one")) b[k] = el.dataset.v || ""; else if (el.classList.contains("chips")) b[k] = [...el.querySelectorAll("button.on")].map(x => x.textContent); else b[k] = el.value.trim(); });
  return b;
}
async function saveSb(submit){
  const body = collect(); body.submit = submit; Object.assign(V, body);
  const btns = document.querySelectorAll(".foot .btn"); btns.forEach(b => b.disabled = true); $("#sb_err").textContent = "";
  try { const r = await post("/onboarding/steckbrief", body); if (submit) { D.steckbrief.done = true; D.complete = !!r.complete; view = "done"; render(); } toast(L.saved); }
  catch(e){ const m = String(e.message); $("#sb_err").textContent = m.startsWith("missing:") ? L.missing + m.slice(8).split(",").map(k => (L.fields[k]||k).replace(" *","")).join(", ") : m; }
  finally { btns.forEach(b => b.disabled = false); }
}

  return `<div class="card"><h2>${L.sb_h}</h2><p class="sub">${L.sb_sub}</p><div class="f">

    <div class="foot"><span class="err" id="sb_err"></span><button class="btn" onclick="saveSb(false)">${L.save}</button><button class="btn p" onclick="saveSb(true)">${D.steckbrief.done ? L.saved + " · " + L.next : L.submit}</button></div></div>
    ${D.steckbrief.done ? `<div class="foot"><a class="btn" href="/">${L.to_portal} →</a></div>` : ""}`;
}
function catHtml(c){
  const n = D.references.counts[c.key] || 0, [title, hint] = c[LANG.toLowerCase()] || c.de, ok = n >= c.min;
  const files = D.references.files.filter(f => f.cat === c.key);
  return `<div class="cat"><div class="h"><b>${esc(title)}</b><span class="pill ${ok?"ok":""}">${n} ${L.of} ${c.min === 0 ? L.optional : c.min + (c.max>c.min?"–"+c.max:"")}</span></div><div class="c">${esc(hint)}</div>
    <div class="bar"><i style="width:${Math.min(100, c.min ? n/c.min*100 : (n?100:0))}%"></i></div>
    <div class="up"><label class="btn p"><input type="file" ${c.video?'accept="video/mp4,video/quicktime"':'accept="image/*"'} multiple onchange="upload('${c.key}', this.files)"> ${L.pick}</label><span class="prog" id="prog_${c.key}"></span></div>
    <div class="thumbs">${files.map(f => `<span>${esc(f.name.replace(/^[^_]+_\d+_\d{8}-\d{6}_/, ""))}<button title="${L.del}" onclick="delRef('${f.id}')">×</button></span>`).join("")}</div></div>`;
}
async function upload(cat, files){
  const list = [...files]; const prog = document.getElementById("prog_" + cat); let i = 0;
  for (const f of list) {
    i++; prog.textContent = `${L.uploading} ${i}/${list.length}: ${f.name}`;
    const fd = new FormData(); fd.append("category", cat); fd.append("file", f, f.name);
    try { const r = await fetch("/onboarding/upload", {method:"POST", body: fd}); const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error || ("HTTP " + r.status));
      D.references.counts = j.counts; D.references.files.push({id:"", name:j.file, cat, link:j.link, at:""}); D.references.done = !!j.references_done; if (D.ofimages) D.ofimages.done = !!j.of_done; if (j.complete) D.complete = true;
    } catch(e){ toast(f.name + ": " + e.message, true); }
    render(); const p2 = document.getElementById("prog_" + cat); if (p2) p2.textContent = i < list.length ? `${L.uploading} ${i}/${list.length}` : "";
  }
  if (D.complete && view === "refs") { view = "done"; render(); } else if (!D.references.files.some(f => !f.id)) {} else { await refreshState(); }
}
async function refreshState(){ try { const r = await fetch("/onboarding/state"); const j = await r.json(); Object.assign(D, j); render(); } catch(e){} }
async function delRef(id){ if (!id) { await refreshState(); return; } try { const r = await post("/onboarding/reference/delete", {id}); D.references.counts = r.counts; D.references.files = D.references.files.filter(f => f.id !== id); D.references.done = false; render(); } catch(e){ toast(e.message, true); } }
function refsHtml(){
  return `<div class="card"><h2>${L.ref_h}</h2><p class="sub">${L.ref_sub}</p><div class="rules">${L.rules}</div>${D.references.categories.map(catHtml).join("")}
    <div class="foot"><button class="bk" onclick="view='sb';render()"><i><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></i>${L.back}</button>${D.references.done ? `<button class="btn p" onclick="view='done';render()">${L.s3} →</button>` : ""}</div></div>`;
}
function ofHtml(){
  const c = D.ofimages || {categories: [], done: false};
  return `<div class="card"><div class="rules">${L.of_rules}</div>${c.categories.map(catHtml).join("")}
    <div class="foot">${c.done ? `<a class="btn p" href="/">${L.to_portal} →</a>` : `<a class="bk" href="/">${L.to_portal}</a>`}</div></div>`;
}
function doneHtml(){ return `<div class="card done"><div class="eyebrow">Northfeed</div><div class="big">${L.sb_done_h}</div><p class="sub">${L.sb_done_t}</p><a class="btn p" href="/">${L.to_portal}</a></div>`; }
function render(){
  $("#lde").className = LANG==="DE"?"on":""; $("#len").className = LANG==="EN"?"on":"";
  $("#main").innerHTML = view === "of"
    ? `<span class="eyebrow">${L.of_eyebrow}${D.model.name?" · "+esc(D.model.name):""}</span><h1>${L.of_h1}</h1><p class="lead">${L.of_lead}</p>${ofHtml()}`
    : `<span class="eyebrow">${L.eyebrow}${D.model.name?" · "+esc(D.model.name):""}</span><h1>${L.sb_page_h1}</h1><p class="lead">${L.sb_page_lead}</p>${view==="sb"?sbHtml():doneHtml()}`;
  window.scrollTo(0,0);
}
render();
</script>
</body></html>
