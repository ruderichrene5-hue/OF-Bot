# Posting-loop concurrency. Was raised to 20 on 2026-08-11 to use the full
# cross-loop ceiling (ADBBOT_MAX_LIVE_PROFILES=20 in /etc/adbbot/env). Reversed
# 2026-09-12 (Rene, explicit instruction): match how GeeLark's posting pass
# runs -- a small deliberate batch "per session" instead of throwing the whole
# ceiling at posting. No --max-concurrent override here any more, so the loop
# falls through to ADBBOT_POSTING_CONCURRENCY in /etc/adbbot/env (currently 3;
# see DEFAULT_POSTING_CONCURRENCY in adb_bot/config/settings.py). Warmup and
# recheck are unaffected either way -- they always capped at 10 on their own.
[Service]
ExecStart=
ExecStart=/root/adb_bot/.venv/bin/python -m adb_bot.automation.run_loop posting --apply
