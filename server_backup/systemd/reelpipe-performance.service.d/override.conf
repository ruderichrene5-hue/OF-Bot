[Service]
# Rene 14.10: pace by budget -- perf_gate.py runs the collector only when it is due
# (runs/day = remaining quota until reset / 2 requests per account, 15 % reserve, 1..24/day)
ExecStart=
ExecStart=/usr/bin/flock -n /run/lock/reelpipe-performance.lock /root/reel_pipeline/.venv/bin/python3 /root/reel_pipeline/perf_gate.py
