# Profile-driven warm-up.
#
# The warm-up population is MultiLogin profiles tagged `Created` -- 45 of them,
# none with an Accounts row. `run_loop warmup` defaults to `--targets accounts`,
# and this base's Accounts table is 11 paused rows, so without the flag below
# the loop planned nothing, exited 0 every hour, and looked healthy while
# nothing was ever warmed up.
#
# `warmup_targets.py` lives only on the `warmup-tab` branch, so the code comes
# from a pinned copy of it rather than /root/adb_bot. That deliberately leaves
# the posting, recheck and queue loops on the tree they already run from: this
# change adds a loop, it does not move the ones that are working. /opt/adbbot-
# warmup/logs is a symlink back to /root/adb_bot/logs so the log still lands
# with the others.
#
# --limit 6 / --max-concurrent 3: a warm-up costs ~17 min of phone and the
# 12-phone ceiling is shared with posting, which runs every 5 minutes. Six an
# hour at three at a time clears the fleet in a working day while never taking
# more than a quarter of the slots. Deferred profiles are logged, not dropped.
[Service]
WorkingDirectory=/opt/adbbot-warmup
Environment=PYTHONPATH=/opt/adbbot-warmup
Environment=ADBBOT_REPO_ROOT=/root/adb_bot
ExecStart=
ExecStart=/root/adb_bot/.venv/bin/python -m adb_bot.automation.run_loop warmup --apply --targets profiles --limit 6 --max-concurrent 3
